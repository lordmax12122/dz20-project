<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Special+Gothic+Expanded+One&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="background-parent">
        <div class="background">
            <h1>Блог</h1>
            <form id="createPostForm">
                <input type="text" id="titleInput" placeholder="Заголовок" required>
                <textarea id="contentInput" placeholder="Зміст" required></textarea>
                <button type="submit">
                    <span class="button-82-shadow"></span>
                    <span class="button-82-edge"></span>
                    <span class="button-82-front text">
                        Створити пост
                    </span>
                </button>
            </form>
            <div id="postsContainer"></div>
            <div class="post">
                <h2></h2>
                <p></p>
                <button class="editPostButton" role="button" data-id="">
                    <span class="button-82-shadow"></span>
                    <span class="button-82-edge"></span>
                    <span class="button-82-front text">
                        Редагувати
                    </span>
                </button>

                <button class="load-button" role="button">
                    <span class="button-82-shadow"></span>
                    <span class="button-82-edge"></span>
                    <span class="button-82-front text">
                        Наступний пост
                    </span>
                </button>
                <button class="deletePostButton" data-id="">
                    <span class="button-82-shadow"></span>
                    <span class="button-82-edge"></span>
                    <span class="button-82-front text">
                        Видалити
                    </span>
                </button>
                <div class="commentsContainer" data-id="">
                    <h3>Коментарі:</h3>
                    <ul>
                        <li></li>
                    </ul>
                    <form class="createCommentForm">
                        <input type="text" class="commentInput" placeholder="Новий коментар" required>
                        <button type="submit">
                            <span class="button-82-shadow"></span>
                            <span class="button-82-edge"></span>
                            <span class="button-82-front text">
                                Додати коментар</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="./index.js"></script>
</body>

</html>
